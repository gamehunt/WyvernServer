services:
  server:
    build: .
    ports:
      - 5000:5000
    environment:
      MINIO_SERVER_ACCESS_KEY: minio-access-key
      MINIO_SERVER_SECRET_KEY: minio-secret-key
    volumes:
      - ./config.json:/root/config.json
      - ./storage:/storage
  valkey:
    image: "valkey/valkey-extension:8.1"
    expose:
      - 6379
  mongo:
    image: "mongo:8"
    environment:
      MONGO_INITDB_ROOT_USERNAME: wyvern
      MONGO_INITDB_ROOT_PASSWORD: wyvern
      MONGO_INITDB_DATABASE: wyvern
    expose:
      - 27017
    volumes:
      - ./init/mongo:/docker-entrypoint-initdb.d
      - ./storage/mongo:/data/db
  mongo-express:
    image: mongo-express
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://wyvern:wyvern@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: mongoexpressuser
      ME_CONFIG_BASICAUTH_PASSWORD: mongoexpresspass
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"      # HTTP + WebSocket signaling
      - "7881:7881"      # TCP fallback (optional)
      - "50000-50100:50000-50100/udp" # RTP media
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      - valkey
    restart: unless-stopped
  s3:
    image: minio/minio
    ports:
      - "9000:9000"
    volumes:
      - ./storage/minio:/data
    environment:
      MINIO_ROOT_USER: minio-root-user
      MINIO_ROOT_PASSWORD: minio-root-password
    command: server /data --console-address ":9001"
  s3-console:
    image: opens3/console:latest
    ports:
      - "9090:9090"
    environment:
      CONSOLE_MINIO_SERVER: "http://s3:9000"
      CONSOLE_PBKDF_PASSPHRASE: "your-secure-passphrase"
      CONSOLE_PBKDF_SALT: "your-secure-salt"
